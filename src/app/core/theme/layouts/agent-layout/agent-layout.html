
<div class="agent-shell">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-icon">I</span>
      <div>
        <h2>InsureCare</h2>
        <small>Agent Portal</small>
      </div>
    </div>

    <p class="menu-label">MY WORKSPACE</p>

    <nav class="menu">
      <a routerLink="/agent/dashboard"
         routerLinkActive="active"
         [routerLinkActiveOptions]="{ exact: true }">
        <span>▦</span>
        Overview
      </a>

      <a routerLink="/agent/policy-lifecycle/issuance"
         routerLinkActive="active">
        <span>▣</span>
        Policy Issuance
      </a>

      <a routerLink="/agent/policy-lifecycle/renewal"
         routerLinkActive="active">
        <span>↻</span>
        Policy Renewal
      </a>

      <a routerLink="/agent/policy-lifecycle/closure"
         routerLinkActive="active">
        <span>×</span>
        Policy Closure
      </a>

      <a routerLink="/agent/policy-lifecycle/servicing"
         routerLinkActive="active">
        <span>⚙</span>
        Policy Servicing
      </a>
    </nav>

    <div class="sidebar-footer">
      <strong>Policy Lifecycle</strong>
      <small>Agent Workspace</small>
    </div>
  </aside>

  <main class="main-area">
    <header class="topbar">
      <div>
        <h1>Agent Workspace</h1>
        <p>Manage policy lifecycle activities.</p>
      </div>

      <div class="agent-profile">
        <span class="avatar">AG</span>
        <div>
          <strong>Agent</strong>
          <small>Policy Management</small>
        </div>
      </div>
    </header>

    <section class="page-content">
      <router-outlet></router-outlet>
    </section>
  </main>
</div>
